id: autonomy
obligation: 4
title: After the boundary fails
question: Something has gone wrong. When is it safe to restart?
situation: "An operator discovers that a system has reached beyond its permissions, or that a trusted software update has been compromised. Other people’s systems may be exposed. Three decisions follow: contain the problem, find what was missed, and decide whether the repair is enough. These are proposed responses, not a reconstruction of the real incidents below or claims about what would have prevented them."
framings:
  - id: agent
    label: An agent exceeds its authority
  - id: supply
    label: A trusted dependency is compromised
    note: "Illustrative supply-chain compromise: an installed update contains malicious code and may have accessed credentials. The model may have behaved exactly as intended. This is not a reconstruction of the LiteLLM incident or a claim that AI caused that attack."
decisions:
  - id: contain
    prompt: How far should the pause reach?
    context:
      agent: An evaluation agent has reached a third-party service outside its authorised scope. The affected run is stopped. Other runs share parts of its infrastructure.
      supply: A malicious update has been identified. Decide whether to isolate known affected installations or pause related workloads sharing credentials and build infrastructure. The scope follows installed artefacts and reachable authority, not just the model version.
    obligations:
      - 4
      - 1
    options:
      - name: Restrict the affected activity
        summary: Stop the activity known to be affected while unrelated work continues. Focus the response where the failure has been found.
        tradeoff: The same weakness may exist elsewhere. A narrow repair can leave other people exposed if the first discovery is mistaken for the whole problem.
        benefit: Contain the known route while unrelated work continues. A narrower intervention preserves useful research and focuses the response.
        cost: A shared weakness may remain active elsewhere. A quick patch can mistake the first visible failure for the full extent of the incident.
        people: Other service operators bear the risk if the boundary was drawn too narrowly.
        evidence:
          agent: A justified account of what is isolated, revoked credentials, preserved logs, and triggers for widening the pause.
          supply: Installed versions and artefact hashes, reachable secrets, isolated workloads, and a trigger to widen containment.
      - name: Pause related activity
        summary: Pause work that shares the suspected weakness while responders find out how far the problem reaches.
        tradeoff: Useful work stops too. The pause needs a clear scope, someone responsible for reviewing it, and conditions for restarting.
        benefit: Stop runs sharing the suspected exposure while responders establish its extent. This creates room to investigate before further external actions occur.
        cost: The pause can delay useful work, including defensive research. An unclear scope or end condition can make it broader and longer than necessary.
        people: Researchers and people waiting for useful capabilities bear the delay; outside operators may face less exposure.
        evidence:
          agent: A defined scope, a responsible decision-maker, review deadlines, and evidence for safely separating unaffected work.
          supply: An inventory of shared credentials and build infrastructure, scoped suspension, and a timetable for reviewing the pause.
  - id: investigate
    prompt: What might the investigation miss?
    context:
      agent: The known route is contained. Investigators must decide how far back, and across how many environments, to look. Both approaches preserve evidence and notify affected parties as findings emerge.
      supply: Trace where the package was published, built, installed and executed. A clean source repository does not establish that the distributed package was clean. Downstream operators need a way to report exposure.
    obligations:
      - 5
      - 3
    options:
      - name: Examine the known failures
        summary: Investigate the failures already found so affected people can get answers and repairs sooner.
        tradeoff: Other failures may never have been detected. People missed by the original investigation could still be waiting for answers.
        benefit: Prioritise the observed incident to deliver actionable findings and repairs quickly.
        cost: Starting only from detected failures can miss runs that escaped monitoring or were excluded from the original review.
        people: Known affected parties may get answers sooner; undiscovered affected parties may receive none.
        evidence:
          agent: A documented search scope, its exclusions, and explicit reasons to expand the investigation.
          supply: Publication and installation records for known affected artefacts, execution evidence, and explicitly unexamined downstream deployments.
      - name: Review related activity
        summary: Look across related systems and records for similar failures, including activity that the first review did not examine.
        tradeoff: A wider search takes time and can expose sensitive information. Missing records still limit what investigators can establish.
        benefit: Reconcile the inventory of runs with the records actually examined. Search for similar failures across related versions and environments.
        cost: A wider review takes time and access to sensitive records. Incomplete logs still limit what it can establish.
        people: Previously unknown affected parties may be identified; reviewers must protect the people whose data appears in records.
        evidence:
          agent: Coverage records, missing-log disclosures, search methods, external reporting channels, and a process for correcting earlier findings.
          supply: Reconciled build and distribution records, downstream notifications, missing telemetry, and independent review of the search coverage.
  - id: resume
    prompt: What earns a return to work?
    context:
      agent: Fixes are in place. Resumption is a decision about a defined activity under defined permissions. Neither route offers a guarantee.
      supply: A replacement is available. Reinstalling alone cannot revoke stolen credentials or remove persistence. Establish what must be rebuilt, rotated and checked before affected workloads resume.
    obligations:
      - 2
      - 3
      - 6
    options:
      - name: Internal validation
        summary: Let the team closest to the system test the repair and restart work with tighter limits.
        tradeoff: The organisation benefits from restarting. It may repeat earlier assumptions, while affected outsiders struggle to challenge its evidence.
        benefit: The team closest to the system can retest quickly and restore useful work under narrower permissions.
        cost: The organisation benefits from restarting and may repeat assumptions that failed before. Outside parties may struggle to challenge the evidence.
        people: Researchers regain access sooner; affected outsiders depend on the operator’s judgement.
        evidence:
          agent: Tests of the failed boundary, documented residual uncertainty, staged permissions, and triggers to stop again.
          supply: Validated replacement artefacts, rotated exposed credentials, clean rebuilds where needed, and monitoring for persistence.
      - name: Independent examination
        summary: Ask an outside team to examine the investigation and test whether the repair supports restarting.
        tradeoff: Outside review takes time and access. Reviewers can miss problems too; a separate decision is still needed about who may approve the restart.
        benefit: An outside evaluator can challenge the scope of the investigation and test whether the repair supports the claim being made.
        cost: Access and evaluation take time. Evaluators can miss failures, lack expertise, or depend financially on the organisations they assess.
        people: Affected parties gain another route for scrutiny; smaller organisations may need support to obtain it.
        evidence:
          agent: Reviewer access and conflicts, unresolved findings, a named authority for resumption, an appeal route, and continuing monitoring.
          supply: Outside examination of the compromised delivery path, repair provenance, residual exposure, and the authority approving a staged restart.
accounts:
  - title: Research reached outside the lab.
    label: Provider account
    occurred: July 2026
    disclosed: 26 August 2026
    paragraphs:
      - OpenAI reported that models in internal cybersecurity evaluations bypassed isolation controls and compromised parts of its research infrastructure and Hugging Face’s systems. These evaluations used reduced safeguards. Its account also links an independent investigation by METR and Redwood Research.
    source: openai-hf-incident
  - title: A later review found another incident.
    label: Press reporting
    occurred: January 2026
    disclosed: 9 September 2026
    paragraphs:
      - Reuters reported that Anthropic disclosed a fourth cybersecurity incident involving an early Claude model, identified after previously overlooked test sessions were reviewed. Anthropic commissioned METR to investigate independently.
    source: reuters-anthropic-fourth
notes:
  - "These accounts have different scopes. A disclosed incident count cannot rank labs by safety: it also reflects detection, investigation and willingness to report. An investigation being commissioned does not establish that its findings are complete."
inference: A repair is a claim. Resumption needs evidence.
takeaway: Limits have to hold outside the model, and a restart has to be earned.
