server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Behind the gateway, relative redirects keep the public scheme, host and port.
  absolute_redirect off;
  include /etc/nginx/security-headers.conf;
  add_header Cache-Control "no-cache" always;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json application/xml;
  gzip_vary on;

  location = /health {
    access_log off;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Earlier editions' paths. Fragments on the old single page are resolved by the home page.
  location ~ ^/(renewal|prototype|composition)/?$ {
    include /etc/nginx/security-headers.conf;
    return 301 /;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /_astro/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Versioned file names (geist-v1, home-v1): a new version is a new name.
  location ~ ^/(fonts|og)/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }
}
